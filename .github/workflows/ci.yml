name: craftedai-node CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      core_api_ref:
        description: core-api ref for the e2e and contract-sync jobs
        default: main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: format / lint / typecheck / test / build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.19.0', '22.x', '24.x']
    env:
      REDIS_URL: redis://localhost:6379
      INTEGRATION_REDIS: '1'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Package exports resolve for ESM and CJS consumers
        run: |
          npx publint --strict
          npx attw --pack .
          node -e "require('./dist/index.cjs')"
          node --input-type=module -e "await import('./dist/index.js')"

  example:
    name: examples/express against the local package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.19.0', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/express/package-lock.json
      # The example depends on the library by file:../.. (a symlink to this checkout), so the
      # library is installed and built first: the example imports its dist/.
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: examples/express
      - run: npm test
        working-directory: examples/express

  contract-sync:
    name: frozen contract matches core-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CraftedAISolutions/core-api
          ref: ${{ inputs.core_api_ref || 'main' }}
          token: ${{ secrets.CORE_API_READ_TOKEN }}
          path: core-api
      - name: Byte-compare the copied contract files and vectors
        run: |
          cmp core-api/src/domain/request-signing/request-token-wire.ts test/contract/core-api/request-token-wire.ts
          cmp core-api/src/domain/request-signing/delegation-token-wire.ts test/contract/core-api/delegation-token-wire.ts
          cmp core-api/src/domain/embed/embed-wire-constants.ts test/contract/core-api/embed-wire-constants.ts
          cmp core-api/src/domain/request-signing/test-vector-kids.ts test/contract/core-api/test-vector-kids.ts
          cmp core-api/test/vectors/request-token.json test/vectors/request-token.json
