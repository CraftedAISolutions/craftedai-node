name: craftedai-node CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      core_api_ref:
        description: core-api ref for the e2e and contract-sync jobs
        default: main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: format / lint / typecheck / test / build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.19.0', '22.x', '24.x']
    env:
      REDIS_URL: redis://localhost:6379
      INTEGRATION_REDIS: '1'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Package exports resolve for ESM and CJS consumers
        run: |
          npx publint --strict
          npx attw --pack .
          node -e "require('./dist/index.cjs')"
          node --input-type=module -e "await import('./dist/index.js')"

  example:
    name: examples/express against the local package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.19.0', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/express/package-lock.json
      # The example depends on the library by file:../.. (a symlink to this checkout), so the
      # library is installed and built first: the example imports its dist/.
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: examples/express
      - run: npm test
        working-directory: examples/express

  contract-sync:
    name: frozen contract matches core-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CraftedAISolutions/core-api
          ref: ${{ inputs.core_api_ref || vars.CORE_API_REF || 'main' }}
          token: ${{ secrets.CORE_API_READ_TOKEN }}
          path: core-api
          persist-credentials: false
      - name: Byte-compare the copied contract files and vectors
        run: |
          cmp core-api/src/domain/request-signing/request-token-wire.ts test/contract/core-api/request-token-wire.ts
          cmp core-api/src/domain/request-signing/delegation-token-wire.ts test/contract/core-api/delegation-token-wire.ts
          cmp core-api/src/domain/embed/embed-wire-constants.ts test/contract/core-api/embed-wire-constants.ts
          cmp core-api/src/domain/request-signing/test-vector-kids.ts test/contract/core-api/test-vector-kids.ts
          cmp core-api/test/vectors/request-token.json test/vectors/request-token.json

  # The onboarding chain against a real core-api (spec §11): init, mint, delegated tool call, revoke.
  #
  # Needs the repository secret CORE_API_READ_TOKEN (a fine-grained token, owner CraftedAISolutions,
  # repository core-api only, Contents: read-only). It also feeds the contract-sync job.
  #
  # Which core-api ref runs is configurable, default `main`:
  #   - manual run:  gh workflow run ci.yml -f core_api_ref=<branch>
  #   - any trigger: set the repository variable CORE_API_REF (Settings > Variables > Actions)
  # Until CRA-351 (the server-key endpoint and the other onboarding endpoints) is merged, core-api
  # `main` does not have them: point this job at `feature/CRA-351-easy-onboarding`, then drop the
  # variable once it is merged.
  e2e:
    name: e2e against core-api in Docker
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 25
    # Fork pull requests never receive secrets: skip rather than fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Require CORE_API_READ_TOKEN
        env:
          CORE_API_READ_TOKEN: ${{ secrets.CORE_API_READ_TOKEN }}
        run: |
          if [ -z "$CORE_API_READ_TOKEN" ]; then
            echo "::error title=CORE_API_READ_TOKEN is not set::Create a fine-grained token (owner CraftedAISolutions, repository core-api only, Contents: read-only) and save it as the repository secret CORE_API_READ_TOKEN."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CraftedAISolutions/core-api
          ref: ${{ inputs.core_api_ref || vars.CORE_API_REF || 'main' }}
          token: ${{ secrets.CORE_API_READ_TOKEN }}
          path: core-api
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: examples/express
      - run: e2e/start-core-api.sh core-api
      - run: npm run test:e2e
        env:
          E2E_CORE_API_DIR: ${{ github.workspace }}/core-api
      - name: core-api logs
        if: failure()
        run: docker compose -f core-api/docker-compose.yml -f e2e/docker-compose.e2e.yml --project-directory core-api logs api worker --tail 300
